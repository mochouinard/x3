<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- x3 — Win32 homage: the Classic theme's bevelled gray, navy mark -->
  <rect x="0" y="0" width="64" height="64" fill="#d4d0c8"/>
  <!-- bevel: light top/left, dark bottom/right -->
  <polygon points="0,0 64,0 60,4 4,4 4,60 0,64" fill="#ffffff"/>
  <polygon points="64,0 64,64 0,64 4,60 60,60 60,4" fill="#808080"/>
  <!-- x (butt caps for the chunky Win32 look) -->
  <g stroke="#0a246a" stroke-width="8" stroke-linecap="square" fill="none">
    <path d="M13,24 L30,44"/>
    <path d="M30,24 L13,44"/>
  </g>
  <!-- 3 -->
  <path d="M38,24 L45,24 Q50,24 50,28 Q50,32 45.5,33.8 Q50,35.6 50,40 Q50,44 45,44 L38,44"
        fill="none" stroke="#0a246a" stroke-width="7" stroke-linecap="square" stroke-linejoin="miter"/>
</svg>
