<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- x3 — isometric cube, x wrapped over the front edge, 3 stamped on top -->
  <!-- top face -->
  <polygon points="32,3 59,17 32,31 5,17" fill="#60a5fa"/>
  <!-- left face -->
  <polygon points="5,17 32,31 32,59 5,45" fill="#2563eb"/>
  <!-- right face -->
  <polygon points="32,31 59,17 59,45 32,59" fill="#1d4ed8"/>
  <!-- x straddling the front edge, inside the silhouette -->
  <g stroke="#ffffff" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M24,37 L40,51"/>
    <path d="M40,37 L24,51"/>
  </g>
  <!-- 3 on the top face -->
  <path d="M27,12 L31,12 Q34,12 34,14.4 Q34,16.6 31.2,16.8 Q34,17 34,19.2 Q34,21.6 31,21.6 L27,21.6"
        fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
